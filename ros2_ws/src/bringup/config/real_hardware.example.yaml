# INERT SCHEMA EXAMPLE. Replace every placeholder with recorded values in a
# private local file. Do not assume the profile proves hardware readiness.
schema_version: 1
identification:
  hardware: "REPLACE ME"
  firmware: "REPLACE ME"
  measurement_record: "REPLACE ME"
sources:
  camera: external  # or opencv, with the camera block below
  lidar: external   # or sllidar_c1, with the lidar block below
  imu: external
  wheel: external
  health: external
# Optional for observation; required for serial. Values in metres.
# model:
#   description_file: measured-expanded.urdf
#   ground_z: MEASURED
#   wheelbase: MEASURED
#   front: MEASURED
#   rear: MEASURED
#   half_width: MEASURED
# Serial is opt-in and requires actual measured calibration. Durations in seconds,
# speed in m/s, steering in rad. Never reuse an example port or guessed values.
# serial:
#   device: /dev/serial/by-id/REPLACE_WITH_DISCOVERED_ID
#   baud: 115200
#   calibration_file: measured-calibration.yaml
#   handshake_timeout: MEASURED
#   write_timeout: MEASURED
#   command_timeout: MEASURED
#   health_timeout: MEASURED
#   max_source_age: MEASURED
#   future_tolerance: MEASURED
#   max_speed: MEASURED
#   max_steer: MEASURED

# Managed camera configuration, required when sources.camera is opencv.
# With sources.camera: external, start a separate ROS camera publisher. Capture settings
# from teammate uamc_pi 2 are shown, not verified negotiated settings/calibration.
# camera:
#   device: /dev/v4l/by-id/REPLACE_WITH_DISCOVERED_ID
#   width: 1280
#   height: 720
#   fps: 30.0
#   fourcc: MJPG
#   frame_id: REPLACE_WITH_MEASURED_OPTICAL_FRAME
#   max_frame_age: 0.3
#   startup_timeout: 5.0
#   frame_timeout: 1.0
#   calibration_file: measured-camera.yaml  # omit for raw-only observation
# Managed C1 configuration, required when sources.lidar is sllidar_c1.
# With sources.lidar: external, start a separate ROS scan publisher. Install the pinned
# sllidar_ros2 source per docs/setup.md#sensor-publishers; this never starts a second RViz.
# lidar:
#   device: /dev/serial/by-id/REPLACE_WITH_DISCOVERED_ID
#   baud: 460800
#   frame_id: REPLACE_WITH_MEASURED_LIDAR_FRAME
#   inverted: false
#   angle_compensate: true
#   scan_mode: Standard
